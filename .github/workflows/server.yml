name: Build and deploy stream collector

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build-publish
    runs-on: self-hosted
    env:
      SERVER_APP_DIR: ${{ secrets.SERVER_APP_DIR }}
    steps:
      - name: Pull and deploy image
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -eu
          test -f "$SERVER_APP_DIR/.env"
          mkdir -p "$SERVER_APP_DIR/data" "$SERVER_APP_DIR/logs" "$SERVER_APP_DIR/state"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
          docker pull "$IMAGE_NAME:latest"
          docker rm -f spire-targets-stream 2>/dev/null || true
          docker run -d \
            --name spire-targets-stream \
            --restart unless-stopped \
            --env-file "$SERVER_APP_DIR/.env" \
            -e TZ=Asia/Jakarta \
            -v "$SERVER_APP_DIR/data:/app/data" \
            -v "$SERVER_APP_DIR/logs:/app/logs" \
            -v "$SERVER_APP_DIR/state:/app/state" \
            "$IMAGE_NAME:latest"
