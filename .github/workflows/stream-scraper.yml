name: Build and deploy stream collector

on:
  push:
    branches: [main]
    paths:
      - scripts/stream_targets.py
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  IMAGE_TAG: github-latest

jobs:
  build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:github-${{ github.sha }}

  deploy:
    needs: build-publish
    runs-on: spdata
    env:
      SERVER_APP_DIR: ${{ secrets.SERVER_APP_DIR }}
    steps:
      - name: Pull and deploy image
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          test -f "$SERVER_APP_DIR/.env"
          mkdir -p "$SERVER_APP_DIR/data" "$SERVER_APP_DIR/logs" "$SERVER_APP_DIR/state"
          trap 'podman logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$GHCR_TOKEN" | podman login ghcr.io -u "$GHCR_USERNAME" --password-stdin
          podman pull "$IMAGE_NAME:$IMAGE_TAG"
          podman rm -f spire-targets-stream-github 2>/dev/null || true
          podman run -d \
            --name spire-targets-stream-github \
            --restart unless-stopped \
            --network host \
            --env-file "$SERVER_APP_DIR/.env" \
            -e TZ=Asia/Jakarta \
            -v "$SERVER_APP_DIR/data:/app/data:Z" \
            -v "$SERVER_APP_DIR/logs:/app/logs:Z" \
            -v "$SERVER_APP_DIR/state:/app/state:Z" \
            "$IMAGE_NAME:$IMAGE_TAG"
